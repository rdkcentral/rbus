# What defines a public/external API entry
public_api_patterns:
  - '\bapi\b\s*[:=]\s*\w+'
  - '\brequest\s+received\b'
  - '\bentry\s+point\b'
 
# What defines internal logs
internal_log_patterns:
  - '\binternal\b'
  - '\bhelper\b'
  - '\butil\b'
  - '\bvalidate\b'
  - '\bparse\b'
  - '\bserialize\b'
  - '\bcache\b'
  - '\bdb\b'
  - '\bipc\b'
 
# Log levels considered noisy when internal
noisy_log_levels:
  - INFO
  - DEBUG
  - TRACE
 
# Keywords indicating failure
failure_keywords:
  - fail
  - error
  - invalid
  - timeout
  - null
  - refused
 
# Allowed severities when failure occurs
required_severity_on_failure:
  - ERROR
  - WARN
 
# Sensitive / PII detection
sensitive_patterns:
  - password
  - passwd
  - token
  - secret
  - serial
  - mac
  - bearer\s+[a-z0-9\-_\.]+
  - ip\s*=\s*\d+\.\d+\.\d+\.\d+
