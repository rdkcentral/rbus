entry_patterns:
    - "\\b([a-zA-Z0-9_]+)\\s*\\("   # function call detected
 
internal_api_patterns:
  - internal
  - helper
  - util
  - impl
  - private
 
noisy_log_levels:
  - INFO
  - DEBUG
  - TRACE
 
failure_keywords:
  - fail
  - failed
  - error
  - timeout
  - denied
  - invalid
 
required_severity_on_failure:
  - WARN
  - ERROR
 
sensitive_patterns:
  - password
  - passwd
  - token
  - secret
  - api[_-]?key
  - mac
  - ipv4
  - email
