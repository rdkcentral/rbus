execution_context:
  entry_patterns:
    - "\\b([a-zA-Z0-9_]+)\\s*\\("   # function call detected
 
noisy_logs:
  disallowed_sources:
    - internal_
    - helper_
    - util_
    - validate_
    - impl_
    - static_
    - private_
 
severity_rules:
  failure_keywords:
    - fail
    - failed
    - error
    - invalid
    - timeout
  required_levels:
    - ERROR
    - WARN
 
sensitive_patterns:
  - name: IP_ADDRESS
    regex: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"
  - name: MAC_ADDRESS
    regex: "\\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\\b"
  - name: TOKEN
    regex: "(?i)(token|apikey|secret|password)[:=]\\S+"
