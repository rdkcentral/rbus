# What defines a public/external API entry
public_api_patterns:
  - '\bapi\b\s*[:=]\s*\w+'
  - '\brequest\s+received\b'
  - '\bentry\s+point\b'
 
# What defines internal logs
internal_log_patterns:
  - '\binternal\b'
  - '\bhelper\b'
  - '\butil\b'
  - '\bvalidate\b'
  - '\bparse\b'
  - '\bserialize\b'
  - '\bcache\b'
  - '\bdb\b'
  - '\bipc\b'
 
# Log levels considered noisy when internal
noisy_log_levels:
  - INFO
  - DEBUG
  - TRACE
 
# Keywords indicating failure
failure_keywords:
  - fail
  - error
  - invalid
  - timeout
  - null
  - refused
 
# Allowed severities when failure occurs
required_severity_on_failure:
  - ERROR
  - WARN

sensitive_patterns:
  # -------------------------------
  # Credentials / Secrets
  # -------------------------------
 
  # JWT tokens (only when value is printed)
  - '(?i)token\s*[:=]\s*[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'
 
  # API keys
  - '(?i)(api[_-]?key|apikey)\s*[:=]\s*[A-Za-z0-9]{20,}'
 
  # Password assignments
  - '(?i)(password|passwd|pwd)\s*[:=]\s*\S{6,}'
 
  # Authorization headers
  - '(?i)authorization\s*[:=]\s*(bearer|basic)\s+[A-Za-z0-9+/=._-]+'
 
  # AWS access key
  - 'AKIA[0-9A-Z]{16}'
 
  # Private key blocks
  - '-----BEGIN .*PRIVATE KEY-----'
 
  # -------------------------------
  # URLs (only when full URL is logged)
  # -------------------------------
  - '(?i)\bhttps?://[^\s<>"]+'
 
  # -------------------------------
  # IP Addresses
  # -------------------------------
 
  # IPv4
  - '\b(?:\d{1,3}\.){3}\d{1,3}\b'
 
  # IPv6 (basic)
  - '\b(?:[A-Fa-f0-9]{1,4}:){2,7}[A-Fa-f0-9]{1,4}\b'
 
  # -------------------------------
  # MAC Addresses
  # -------------------------------
  - '\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'
