# ------------------------------
# Rules for log analyzer
# ------------------------------
 
# Patterns to detect sensitive information
sensitive_patterns:
  # JWT tokens
  - '(?i)\btoken\s*[:=]\s*[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\b'
 
  # API keys
  - '(?i)\b(api[_-]?key|apikey)\s*[:=]\s*[A-Za-z0-9]{20,}\b'
 
  # Password assignments
  - '(?i)\b(password|passwd|pwd)\s*[:=]\s*\S{6,}\b'
 
  # Authorization headers
  - '(?i)\bauthorization\s*[:=]\s*(bearer|basic)\s+[A-Za-z0-9+/=._-]+\b'
 
  # AWS keys
  - '\bAKIA[0-9A-Z]{16}\b'
 
  # Private key blocks
  - '-----BEGIN .*PRIVATE KEY-----'
 
  # URLs
  - r'\bhttps?://[^\s]+'
 
  # IP addresses
  - r'\b(?:\d{1,3}\.){3}\d{1,3}\b'
 
  # MAC addresses
  - r'\b([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})\b'
 
# Patterns that identify start of public API execution
public_api_patterns:
  - 'rbus\.c'
 
# Patterns for internal logs that are considered noisy during public API
#internal_log_patterns:
#  - r'\binternal_api\b'
#  - r'\bdebug_internal\b'
#  - r'\bhelper_function\b'
 
# Log levels considered noisy
noisy_log_levels:
  - DEBUG
  - TRACE
  - INFO
 
# Keywords indicating failure
failure_keywords:
  - 'failed'
  - 'error'
  - 'exception'
  - 'invalid'
  - 'timeout'
 
# Required log levels for failure messages
required_severity_on_failure:
  - ERROR
  - WARN
